name: Score frozen 2026 prospective forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 12-20 11 *'
permissions:
  contents: write
  actions: write
concurrency:
  group: frozen-prospective-20261030
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out immutable forecast history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install scoring dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Check gates, acquire complete outcomes and score
        id: evaluate
        run: python src/collect_prospective_actuals.py --github-output "$GITHUB_OUTPUT"
      - name: Preserve first scored episode in Git
        id: commit_scores
        if: steps.evaluate.outputs.scored == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/prospective_20261030_scoring_v1
          git commit -m 'Score frozen prospective episode from first complete later snapshot'
          git push origin HEAD:main
      - name: Retain scoring artifact even if branch rules block commit
        id: preserve_artifact
        if: always() && steps.evaluate.outputs.scored == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prospective-20261030-scoring
          path: results/prospective_20261030_scoring_v1
          retention-days: 90
      - name: Disable one-shot schedule after scores are retained
        if: always() && steps.evaluate.outputs.scored == 'true' && (steps.commit_scores.outcome == 'success' || steps.preserve_artifact.outcome == 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/prospective-evaluation.yml/disable"
